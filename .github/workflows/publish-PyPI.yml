name: Publish to PyPI
run-name: Publish Python Package to PyPI for release ${{ github.event.release.tag_name || inputs.tag_name }}

# Each package is versioned and released separately, from its own tags
# (setuptools-scm only matches its package's prefix): a release tagged
# oq_wrapper-v2026.11.1 publishes oq-wrapper 2026.11.1, one tagged
# gm_models-v2026.11.1 publishes gm-models 2026.11.1.
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag_name:
        description: "Git tag to checkout and publish, e.g. gm_models-v2026.11.1"
        required: true
        type: string

jobs:
  package:
    runs-on: ubuntu-latest
    outputs:
      dir: ${{ steps.tag.outputs.dir }}
      project: ${{ steps.tag.outputs.project }}
    steps:
      - id: tag
        env:
          TAG: ${{ github.event.release.tag_name || inputs.tag_name }}
        run: |
          case "$TAG" in
            oq_wrapper-v* | gm_models-v*) dir="${TAG%%-v*}" ;;
            *) echo "::error::Tag '$TAG' must start with oq_wrapper-v or gm_models-v"; exit 1 ;;
          esac
          echo "dir=$dir" >> "$GITHUB_OUTPUT"
          echo "project=${dir//_/-}" >> "$GITHUB_OUTPUT"

  # oq_wrapper: one pure wheel plus the sdist. gm_models: the sdist plus a
  # cibuildwheel matrix (Linux, macOS, Windows) over every CPython that
  # requires-python allows. See ucgmsim/meta-ci-action's README.
  build:
    needs: package
    uses: ucgmsim/meta-ci-action/.github/workflows/build-dist.yml@v2
    with:
      ref: ${{ inputs.tag_name }} # empty on a release: builds the release tag
      working-directory: ${{ needs.package.outputs.dir }}

  publish-to-pypi:
    name: Publish ${{ needs.package.outputs.project }} to PyPI
    needs: [package, build]
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/${{ needs.package.outputs.project }}
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: ${{ needs.build.outputs.artifact-name }}
          path: dist/
      - uses: pypa/gh-action-pypi-publish@v1.14.3
        with:
          # Prints PyPI's response, which carries the reason an upload is rejected.
          verbose: true
