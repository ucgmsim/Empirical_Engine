[build-system]
requires = ["setuptools", "setuptools-scm"]
build-backend = "setuptools.build_meta"

[tool.setuptools_scm]

[project]
name = "oq-wrapper"
authors = [{ name = "ucgmsim" }]
description = "Wrapper for OpenQuake engine to run empirical GMMs"
readme = "README.md"
# Python 3.15 is blocked by openquake-engine's dependencies:
#   - h5py: no cp315 wheels yet (expected with h5py 3.17,
#     https://github.com/h5py/h5py/issues/2972); the sdist needs a system HDF5.
#   - fiona (imported by several openquake GSIMs): no cp315 wheels, no release
#     since 1.10.1 (2024-09), and the sdist needs a system GDAL.
# Lift the cap once both ship cp315 wheels (or openquake drops fiona).
requires-python = ">=3.11,<3.15"
dynamic = ["version"]
dependencies = [
  "numpy>=2.0",
  "openquake.engine @ git+https://github.com/gem/oq-engine.git@master",
  "pandas",
  "pyyaml",
  "scipy>=1.7.2",
  # Suggested minimum version that handles the indexing logic in the xarray
  # module properly.
  "xarray>=2022.3.0",
  # Not imported by oq_wrapper, but openquake.hazardlib imports fiona when
  # loading its gsim modules and openquake.engine does not declare it
  # (it was previously pulled in transitively by source-modelling).
  "fiona",
]

[project.optional-dependencies]
# pyarrow is needed for pd.read_parquet in the tests and examples.
test = ["pytest", "tqdm>=4.0.0", "pyarrow"]
# source-modelling is only imported under TYPE_CHECKING (for the Plane annotation).
types = ["pandas-stubs", "scipy-stubs", "source-modelling"]
dev = ["ruff", "deptry", "ty"]

[tool.uv]
# OQ >= 3.27 depends on the gdal Python bindings, which have no Linux wheels and need
# a matching system libgdal (CI's apt libgdal is too old). Only OQ's secondary perils
# module (openquake.sep) uses them, so drop gdal.
override-dependencies = ["gdal; sys_platform == 'never'"]

[tool.deptry]
pep621_dev_dependency_groups = ["test", "dev", "types"]
extend_exclude = ["tests", "scripts/one_offs"]

[tool.deptry.per_rule_ignores]
# fiona is an undeclared runtime import of openquake.hazardlib, see above.
DEP002 = ["fiona"]


[tool.setuptools.packages.find]
exclude = ["tests*"]

[tool.ty.src]
exclude = ["scripts/one_offs"]

[tool.npdlint]
include = ["oq_wrapper"]

[tool.pytest.ini_options]
# generate_benchmark_outputs.py regenerates tests/benchmark_data/*.parquet as a
# module-level side effect on import (no __main__ guard); --doctest-modules
# must never collect it.
addopts = "--doctest-modules --ignore=tests/benchmark_data/generate_benchmark_outputs.py"
testpaths = ["tests", "oq_wrapper"]

[tool.ruff]
exclude = ["scripts/one_offs"]

[tool.ruff.lint]
extend-select = [
  # isort imports
  "I",
  # Use r'\s+' rather than '\s+'
  "W605",
  # All the naming errors, like using camel case for function names.
  "N",
  # Missing docstrings in classes, methods, and functions
  "D101",
  "D102",
  "D103",
  "D105",
  "D107",
  # Use f-string instead of a format call
  "UP032",
  # Standard library import is deprecated
  "UP035",
  # Missing function argument type-annotation
  "ANN001",
  # Using except without specifying an exception type to catch
  "BLE001",
  # Missing function argument type-annotation
  "ANN001",
  "ANN002",
  "ANN003",
  "ANN201",
  "ANN202",
  "ANN204",
  "ANN205",
  "ANN206",
  # Using except without specifying an exception type to catch
  "BLE001",
]
ignore = ["D104"]

[tool.ruff.lint.pydocstyle]
convention = "numpy"

[tool.ruff.lint.isort]
known-first-party = [
  "source_modelling",
  "workflow",
  "pygmt_helper",
  "empirical",
  "nshmdb",
  "IM_calculation",
  "mera",
]

[tool.ruff.lint.per-file-ignores]
# Ignore no docstring in __init__.py
"__init__.py" = ["D104"]
# Ignore docstring errors in tests folder
"tests/**.py" = ["D"]

[tool.numpydoc_validation]
checks = [
  "GL05",
  "GL08",
  "GL10",
  "PR01",
  "PR02",
  "PR03",
  "PR04",
  "PR05",
  "PR06",
  "PR07",
  "RT01",
  "RT02",
  "RT03",
  "RT04",
  "YD01",
]
# remember to use single quotes for regex in TOML
exclude = [ # don't report on objects that match any of these regex
  '\.undocumented_method$',
  '\.__repr__$',
]
