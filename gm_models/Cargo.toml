[package]
name = "gm_models"
version = "0.1.0"
edition = "2021"
resolver = "2"

[lib]
name = "_core"
crate-type = ["cdylib", "lib"]
path = "src-rust/lib.rs"

[dependencies]
numpy = "0.30"
pyo3 = "0.30"
thiserror = "2"

[dev-dependencies]
approx = "0.5.1"
criterion = { version = "0.5", features = ["html_reports"] }
csv = "1.4.0"
pprof = { version = "0.15", features = ["criterion", "flamegraph"] }
proptest = "1"
serde = { version = "1.0.228", features = ["serde_derive"] }

[build-dependencies]
csv = "1.4.0"
serde = { version = "1.0.228", features = ["serde_derive"] }

[[bench]]
name = "p21"
harness = false
