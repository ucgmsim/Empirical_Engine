[package]
name = "gm_models"
version = "0.1.0"
edition = "2021"
license = "AGPL-3.0-or-later"

[lib]
name = "_core"
crate-type = ["cdylib", "lib"]
path = "src-rust/lib.rs"

[dependencies]
numpy = "0.30"
pyo3 = "0.30"
thiserror = "2"

[dev-dependencies]
approx = "0.5"
criterion = { version = "0.5", features = ["html_reports"] }
csv = "1.4.0"
pprof = { version = "0.15", features = ["criterion", "flamegraph"] }
proptest = "1"

[build-dependencies]
csv = "1.4.0"

[[bench]]
name = "p21"
harness = false
