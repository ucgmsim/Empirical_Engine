[build-system]
requires = ["setuptools", "setuptools-scm", "setuptools-rust>=1.1.0"]
build-backend = "setuptools.build_meta"

[project]
name = "gm-models"
authors = [{ name = "ucgmsim" }]
description = "Native (Rust) reimplementations of empirical ground motion models"
readme = "README.md"
requires-python = ">=3.11"
dynamic = ["version"]
dependencies = ["numpy>=2.0"]

[tool.setuptools_scm]
root = ".."

[project.optional-dependencies]
test = ["pytest", "pandas[pyarrow]"]
types = ["pandas-stubs"]
dev = ["ruff", "deptry", "ty"]

[tool.deptry]
pep621_dev_dependency_groups = ["test", "dev", "types"]

[tool.setuptools.packages]
find = { where = ["."], include = ["gm_models"], exclude = ["tests", "src-rust"] }

[[tool.setuptools-rust.ext-modules]]
target = "gm_models._utils"
binding = "PyO3"

[tool.ruff.lint]
extend-select = [
  "I",
  "W605",
  "N",
  "D101",
  "D102",
  "D103",
  "D105",
  "D107",
  "UP032",
  "UP035",
  "ANN001",
  "ANN002",
  "ANN003",
  "ANN201",
  "ANN202",
  "ANN204",
  "ANN205",
  "ANN206",
  "BLE001",
]

[tool.ruff.lint.pydocstyle]
convention = "numpy"

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["D104"]
"tests/**.py" = ["D"]

[tool.uv]
cache-keys = [
  { file = "pyproject.toml" },
  { file = "Cargo.toml" },
  { file = "**/*.rs" },
]
