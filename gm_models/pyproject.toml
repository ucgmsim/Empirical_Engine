[build-system]
requires = ["setuptools>=77", "setuptools-scm", "setuptools-rust>=1.1.0"]
build-backend = "setuptools.build_meta"

[project]
name = "gm-models"
authors = [{ name = "ucgmsim" }]
description = "Native (Rust) reimplementations of empirical ground motion models"
readme = "README.md"
license = "AGPL-3.0-or-later"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dynamic = ["version"]
dependencies = [
    "numpy>=2.0",
    "pandas",
    "xarray>=2026.9.0",
]

[tool.setuptools_scm]
root = ".."

[project.optional-dependencies]
test = ["pytest", "pyarrow"]
types = ["pandas-stubs"]
dev = ["ruff", "deptry", "ty"]

[tool.deptry]
pep621_dev_dependency_groups = ["test", "dev", "types"]
# Scripts run in an OpenQuake environment, not gm_models' own.
extend_exclude = ["scripts"]

[tool.setuptools.packages]
find = { where = ["."], include = ["gm_models"], exclude = ["tests", "src-rust"] }

[[tool.setuptools-rust.ext-modules]]
target = "gm_models._core"
binding = "PyO3"

[tool.ruff.lint]
extend-select = [
  "I",
  "W605",
  "N",
  "D101",
  "D102",
  "D103",
  "D105",
  "D107",
  "UP032",
  "UP035",
  "ANN001",
  "ANN002",
  "ANN003",
  "ANN201",
  "ANN202",
  "ANN204",
  "ANN205",
  "ANN206",
  "BLE001",
]

[tool.ruff.lint.pydocstyle]
convention = "numpy"

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["D104"]
"tests/**.py" = ["D"]

[tool.numpydoc_validation]
checks = [
  "GL05",
  "GL08",
  "GL10",
  "PR01",
  "PR02",
  "PR03",
  "PR04",
  "PR05",
  "PR06",
  "PR07",
  "RT01",
  "RT02",
  "RT03",
  "RT04",
  "YD01",
]
# remember to use single quotes for regex in TOML
exclude = [ # don't report on objects that match any of these regex
  '\.undocumented_method$',
  '\.__repr__$',
]

[tool.uv]
cache-keys = [
  { file = "pyproject.toml" },
  { file = "Cargo.toml" },
  { file = "build.rs" },
  { file = "src-rust/**/*.rs" },
  { file = "data/*.csv" },
]
